[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "uniflow"
version = "0.1.0"
description = "Local-first study orchestration foundation."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "UniFlow" }]
dependencies = [
    "alembic>=1.13",
    "pydantic>=2.7",
    "PySide6>=6.10.1,<7",
    "pypdf>=5.0,<7",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0",
    "typer>=0.12",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4,<5",
]

[project.scripts]
uniflow = "uniflow.cli.main:app"
uniflow-gui = "uniflow.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/uniflow"]

[tool.hatch.build.targets.wheel.force-include]
"src/uniflow/gui/assets" = "uniflow/gui/assets"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
